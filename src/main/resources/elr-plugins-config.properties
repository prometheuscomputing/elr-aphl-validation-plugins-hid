# Data sources for the APHL ELR validation plugins.
#
# Every check reads the CSV snapshots bundled in this jar. The WS mode calls
# services on aphl.nist.gov / vocab.nist.gov, which are not reachable from the
# hosted tools any more; a plugin left on WS reports "Constraint Spec Error"
# on every message.
#
# The folders below are the ones the 2026-03-13 build (elr-r1-validation-plugins
# 1.0.2-20260313.143810-4, shipped with GVT 1.3.6 and 1.3.7) had compiled in as
# constants, so the data selection is unchanged, except ARLN: that one moved to
# the 2026-08-25 tables APHL sent (CRE PCR results, GC facility and
# jurisdiction codes, new microorganisms and the rest of the revision log
# since the 2023-05-16 set).

# ARLN
ARLN_OBX=CSV
ARLN_OBX3=CSV
ARLN_SPM4=CSV
